</style></head><body><a class="skip" href="#content">İçeriğe geç</a><header class="top"><div class="brand">Araştırma · Uzman görüşü<strong>Tıp kütüphaneciliğinin yetkinlikleri</strong></div><span>AHP değerlendirme formu / 02</span></header><div class="layout"><aside class="sidebar"><strong id="progressText"></strong><div class="progress" role="progressbar" aria-label="Yanıtlanan karşılaştırmalar" aria-valuemin="0" aria-valuemax="27"><i id="bar"></i></div><div id="saveStatus"></div><nav class="nav" aria-label="Form bölümleri" id="nav"></nav><details><summary>Yardıma mı ihtiyacınız var?</summary><p><small>Her soruda önce bir ifade veya eşit önem seçin. Bir ifade seçtiyseniz ardından 2–9 arasında derece belirleyin. Yanıtınızı istediğiniz zaman değiştirebilirsiniz.</small></p><button class="textbtn" data-go="0">Ölçeği ve açıklamaları aç</button></details></aside><main id="content" tabindex="-1"></main></div><section id="print" class="print-only"></section><input type="file" id="importFile" accept=".json,application/json" hidden><script>
const domains = {
  A1:"Bilgi ve Klinik Destek Yetkinlikleri", A2:"Eğitim ve Kullanıcı Hizmetleri Yetkinlikleri",
  A3:"Dijital ve Veri Yönetimi Yetkinlikleri", A4:"Yönetim ve Kurumsal Yetkinlikler"
};
const themes = {
  T1:{parent:"A1",name:"Bilgiye Erişim ve Literatür Hizmetleri"}, T2:{parent:"A1",name:"Klinik, Tıbbi ve Araştırma Destek Yetkinlikleri"},
  T3:{parent:"A2",name:"Eğitim ve Öğretim Yetkinlikleri"}, T4:{parent:"A2",name:"Kullanıcı ve Toplum Hizmetleri"},
  T5:{parent:"A3",name:"Veri ve Bilgi Yönetimi"}, T6:{parent:"A3",name:"Dijital Okuryazarlık ve Teknoloji Yönetimi"},
  T7:{parent:"A4",name:"Kütüphane Operasyon ve Süreç Yönetimi"}, T8:{parent:"A4",name:"İletişim, İş Birliği ve Sosyal Beceriler"},
  T9:{parent:"A4",name:"İdari ve Kurumsal Yönetim"}
};
const basics = {
  B1:{parent:"T1",name:"Bilgi Arama Stratejileri Geliştirme"}, B2:{parent:"T1",name:"Farklı Veri Tabanlarında Etkin Arama"}, B3:{parent:"T1",name:"Kanıta Dayalı Bilgiye Erişim ve Sunum"},
  B4:{parent:"T2",name:"Klinik Ekiplerle İş Birliği"}, B5:{parent:"T2",name:"Araştırma Metodolojisi Bilgisi"}, B6:{parent:"T2",name:"Kanıta Dayalı Uygulama Desteği"},
  B7:{parent:"T3",name:"Bilgi Okuryazarlığı Eğitimi Verme"}, B8:{parent:"T3",name:"Kullanıcı Eğitimi ve Danışmanlığı"},
  B9:{parent:"T5",name:"Araştırma Verisi Yönetimi"}, B10:{parent:"T5",name:"Veri Gizliliği ve Güvenliği"},
  B11:{parent:"T6",name:"Elektronik Kütüphane Sistemleri Yönetimi"}, B12:{parent:"T6",name:"Yazılım ve Programlama Bilgisi"}, B13:{parent:"T6",name:"Dijital Kaynak ve İçerik Yönetimi"},
  B14:{parent:"T7",name:"Koleksiyon Geliştirme ve Yönetimi"}, B15:{parent:"T7",name:"Proje Yönetimi"},
  B16:{parent:"T8",name:"Etkili Sözlü ve Yazılı İletişim"}, B17:{parent:"T8",name:"Paydaşlarla İş Birliği Geliştirme"},
  B18:{parent:"T9",name:"Stratejik Planlama ve Politika Geliştirme"}, B19:{parent:"T9",name:"Kalite Kontrol ve Hizmet İyileştirme"},
  B20:{parent:"T4",name:"Toplum Odaklı Bilgi Hizmetleri Sunma"}, B21:{parent:"T4",name:"Kişiye Özel Hizmet Sunma"}
};
const nameOf = id => domains[id] || themes[id]?.name || basics[id]?.name || id;
const matrixDefs = [
  {id:"M01",title:"Ana alanlar",context:"Amaç → ana alanlar",elements:["A1","A2","A3","A4"]},
  {id:"M02",title:"A1 temaları",context:"A1 → temalar",elements:["T1","T2"]},
  {id:"M03",title:"A2 temaları",context:"A2 → temalar",elements:["T3","T4"]},
  {id:"M04",title:"A3 temaları",context:"A3 → temalar",elements:["T5","T6"]},
  {id:"M05",title:"A4 temaları",context:"A4 → temalar",elements:["T7","T8","T9"]},
  {id:"M06",title:"T1 temel yetkinlikleri",context:"T1 → temel yetkinlikler",elements:["B1","B2","B3"]},
  {id:"M07",title:"T2 temel yetkinlikleri",context:"T2 → temel yetkinlikler",elements:["B4","B5","B6"]},
  {id:"M08",title:"T3 temel yetkinlikleri",context:"T3 → temel yetkinlikler",elements:["B7","B8"]},
  {id:"M09",title:"T4 temel yetkinlikleri",context:"T4 → temel yetkinlikler",elements:["B20","B21"]},
  {id:"M10",title:"T5 temel yetkinlikleri",context:"T5 → temel yetkinlikler",elements:["B9","B10"]},
  {id:"M11",title:"T6 temel yetkinlikleri",context:"T6 → temel yetkinlikler",elements:["B11","B12","B13"]},
  {id:"M12",title:"T7 temel yetkinlikleri",context:"T7 → temel yetkinlikler",elements:["B14","B15"]},
  {id:"M13",title:"T8 temel yetkinlikleri",context:"T8 → temel yetkinlikler",elements:["B16","B17"]},
  {id:"M14",title:"T9 temel yetkinlikleri",context:"T9 → temel yetkinlikler",elements:["B18","B19"]}
];
const comparisons = [];
for (const matrix of matrixDefs) for (let i=0;i<matrix.elements.length;i++) for (let j=i+1;j<matrix.elements.length;j++) comparisons.push({
  no:comparisons.length+1, matrixId:matrix.id, context:matrix.context, leftId:matrix.elements[i], rightId:matrix.elements[j], left:nameOf(matrix.elements[i]), right:nameOf(matrix.elements[j])
});

const descriptions={
A1:'Güvenilir sağlık bilgisine erişim ile klinik ve araştırma süreçlerine bilgi desteği sağlama.',A2:'Kullanıcıların öğrenmesini, bilgi gereksinimlerinin anlaşılmasını ve uygun hizmete ulaşmasını sağlama.',A3:'Araştırma verilerini, dijital kaynakları ve kütüphane teknolojilerini yönetme.',A4:'Hizmetleri planlama, iş birliği kurma ve kütüphanenin kurumsal işleyişini geliştirme.',
T1:'Bilgi gereksinimini arama stratejisine dönüştürme, kaynak bulma ve uygun bilgiyi sunma.',T2:'Klinik ekiplerin ve araştırmacıların çalışma süreçlerine yöntem ve kanıt desteği sağlama.',T3:'Kullanıcıların bilgiye erişim ve kaynak kullanma becerilerini eğitim ve danışmanlıkla geliştirme.',T4:'Farklı toplulukların ve bireylerin gereksinimlerine uygun bilgi hizmetleri tasarlama.',T5:'Araştırma verisinin düzenlenmesi, korunması ve sorumlu kullanımına destek verme.',T6:'Dijital sistemleri ve kaynakları işletme, teknik araçları hizmetlerde kullanma.',T7:'Koleksiyonları, projeleri ve günlük hizmet süreçlerini yönetme.',T8:'Bilgi alışverişini ve paydaşlar arasındaki iş birliğini güçlendirme.',T9:'Kurumsal hedefleri, politikaları ve hizmet kalitesini planlama ve izleme.',
B1:'Bilgi sorusunu kavramlara ayırma; anahtar sözcükler, konu başlıkları ve arama mantığı oluşturma.',B2:'Veri tabanlarının arayüz ve indeksleme özelliklerini kullanarak uygun kayıtları bulma.',B3:'Güvenilir kanıta ulaşma ve bulunan bilgiyi gereksinime uygun biçimde sunma.',B4:'Klinik ekibin bilgi gereksinimlerini anlayarak ekiple birlikte çalışma.',B5:'Araştırma desenleri, temel yöntemler ve araştırma süreçleri hakkında bilgi sahibi olma.',B6:'Kanıtın klinik sorular ve uygulama süreçleriyle ilişkilendirilmesine bilgi desteği sağlama.',B7:'Bilgiyi bulma, değerlendirme ve etik kullanma becerileri üzerine eğitim hazırlama ve verme.',B8:'Kaynak ve hizmet kullanımı konusunda kullanıcıya uygulamalı eğitim ve danışmanlık sağlama.',B9:'Araştırma verisinin planlanması, düzenlenmesi, belgelenmesi, saklanması ve paylaşımına destek verme.',B10:'Veriye erişim, mahremiyet ve güvenli saklama süreçlerinde uygun önlemleri gözetme.',B11:'Katalog, keşif ve benzeri elektronik kütüphane sistemlerinin işleyişini yönetme.',B12:'Hizmet geliştirme veya iş akışlarını kolaylaştırma amacıyla yazılım ve programlama bilgisini kullanma.',B13:'Elektronik kaynakların ve dijital içeriklerin düzenlenmesini, erişimini ve sürdürülebilirliğini yönetme.',B14:'Kullanıcı gereksinimlerine göre kaynak seçimi, değerlendirme ve koleksiyonun sürdürülmesini sağlama.',B15:'Bir çalışmanın kapsamını, takvimini, kaynaklarını ve ilerleyişini planlama ve takip etme.',B16:'Bilgiyi farklı muhataplara açık, anlaşılır ve uygun bir dille aktarma.',B17:'Kurum içi ve dışındaki paydaşlarla sürdürülebilir ortak çalışmalar geliştirme.',B18:'Kütüphanenin hedeflerini belirleme ve bu hedefleri destekleyen plan ve politikalar oluşturma.',B19:'Hizmetleri değerlendirme, sorunları belirleme ve iyileştirme çalışmalarını yürütme.',B20:'Belirli toplulukların ortak bilgi gereksinimlerine ve erişim koşullarına uygun hizmet sunma.',B21:'Hizmeti bireyin bilgi gereksinimine, koşullarına ve tercihine göre uyarlama.'};
const labels={1:'Eşit önem',2:'Ara değer',3:'Orta derecede',4:'Ara değer',5:'Güçlü derecede',6:'Ara değer',7:'Çok güçlü derecede',8:'Ara değer',9:'Aşırı derecede'};
const KEY='ahp-tip-v2-draft', VERSION='AHP-TIP-KUTUPHANECILIGI-27-v2';
let answers=new Map(), pending={}, page=0, meta={expertCode:'',role:'',experienceYears:'',institutionType:''}, persist=false, storageMessage='', restored=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parentOf(m){return m.id==='M01'?null:(m.elements[0][0]==='T'?themes[m.elements[0]].parent:basics[m.elements[0]].parent)}
function titleOf(m){return m.id==='M01'?'Dört ana alanın önemi':nameOf(parentOf(m))}
function sentence(a){return !a?'Henüz yanıtlanmadı':a.side==='equal'?'İki ifade eşit önemde.':nameOf(a.side==='left'?a.leftId:a.rightId)+' daha önemli — '+a.degree+' ('+labels[a.degree]+').'}
function save(){if(!persist)return;try{localStorage.setItem(KEY,JSON.stringify(payload(true)));storageMessage='Bu tarayıcıda taslak kaydedildi.'}catch(e){storageMessage='Tarayıcıya kayıt yapılamadı. Taslağınızı dosya olarak indirin.'}}
function payload(draft=false){return {formVersion:VERSION,hierarchyVersion:'4-9-21-v1',method:'Saaty 1-9; yön ve derece; karşılıklılık',draft,createdAt:new Date().toISOString(),metadata:{...meta,experienceYears:meta.experienceYears===''?null:Number(meta.experienceYears)},comparisons:comparisons.filter(c=>answers.has(c.no)).map(c=>answers.get(c.no))}}
function ingest(p){if(!['AHP-TIP-KUTUPHANECILIGI-27-v1',VERSION].includes(p.formVersion)||!p.metadata||!Array.isArray(p.comparisons))throw Error('Bu dosya desteklenen bir AHP yanıt dosyası değil.');const next=new Map();for(const a of p.comparisons){if(!a)continue;const c=comparisons.find(c=>c.no===a.no);if(!c||next.has(a.no)||a.leftId!==c.leftId||a.rightId!==c.rightId||a.matrixId!==c.matrixId||!['equal','left','right'].includes(a.side)||!Number.isInteger(a.degree)||(a.side==='equal'?a.degree!==1:a.degree<2||a.degree>9))throw Error('Dosyadaki karşılaştırmalar bu form ile uyuşmuyor.');const value=a.side==='equal'?1:a.side==='left'?a.degree:1/a.degree;if(typeof a.value!=='number'||Math.abs(a.value-value)>1e-9)throw Error('Dosyada yön ve sayısal değer uyuşmazlığı var.');next.set(c.no,{...c,side:a.side,degree:a.degree,value});}const m=p.metadata;for(const k of ['expertCode','role','institutionType'])if(m[k]!=null&&typeof m[k]!=='string')throw Error('Uzman bilgileri okunamadı.');if(m.experienceYears!=null&&m.experienceYears!==''&&(!Number.isInteger(Number(m.experienceYears))||Number(m.experienceYears)<0||Number(m.experienceYears)>80))throw Error('Deneyim yılı geçersiz.');answers=next;pending={};meta={expertCode:m.expertCode||'',role:m.role||'',institutionType:m.institutionType||'',experienceYears:m.experienceYears??''};}
function progress(){document.getElementById('progressText').textContent=answers.size+' / 27 karşılaştırma';document.getElementById('bar').style.width=(answers.size/27*100)+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',answers.size);document.getElementById('saveStatus').textContent=persist?storageMessage:'Yanıtlarınız henüz araştırmacıya gönderilmedi.';document.getElementById('nav').innerHTML='<button data-go="0" class="'+(page===0?'active':'')+'">Başlangıç ve rehber</button>'+matrixDefs.map((m,i)=>{const cs=comparisons.filter(c=>c.matrixId===m.id),done=cs.filter(c=>answers.has(c.no)).length;return ([0,1,5].includes(i)?'<div class="nav-label">'+(i===0?'1 · Ana alanlar':i===1?'2 · Temalar':'3 · Temel yetkinlikler')+'</div>':'')+'<button data-go="'+(i+1)+'" '+(page===i+1?'aria-current="step"':'')+' class="'+(page===i+1?'active ':'')+(done===cs.length?'completed':'')+'">'+(i+1)+'. '+esc(titleOf(m))+' <small>'+done+'/'+cs.length+'</small></button>';}).join('')+'<button data-go="15" class="'+(page===15?'active':'')+'">Kontrol ve teslim</button>';}
function guide(){return '<div class="card"><div class="eyebrow">Uzman görüşünüz neden önemli?</div><h1>Mesleğin gerektirdiği yetkinlikleri birlikte değerlendirelim.</h1><p class="lead">Türkiye’de tıp kütüphaneciliği hizmetleri açısından hangi yetkinliklerin görece daha önemli olduğunu mesleki deneyiminize dayanarak değerlendirmenizi istiyoruz.</p><div class="stats"><div><strong>4</strong><span>ana alan</span></div><div><strong>9</strong><span>tema</span></div><div><strong>21</strong><span>temel yetkinlik</span></div><div><strong>27</strong><span>karşılaştırma</span></div></div><div class="hint"><b>Değerlendirme çerçevesi</b><br>Kendi yeterliliğinizi veya kurumunuzun mevcut performansını puanlamayın. Tıp kütüphanecisinin etkili hizmet sunabilmesi için gereken <b>göreli önemi</b> düşünün. İki yetkinlik de önemli olabilir; soru, verilen başlık altında hangisinin daha öncelikli olduğudur.</div><div class="steps"><div class="step"><b>01 · Karşılaştırın</b>İki ifadeyi ve kısa açıklamalarını okuyun. Önemli gördüğünüz ifadeyi veya eşit önemi seçin.</div><div class="step"><b>02 · Derecelendirin</b>Bir ifade daha önemliyse farkın derecesini 2–9 arasında belirtin.</div><div class="step"><b>03 · Kontrol edip iletin</b>Yanıtlarınızı gözden geçirin. Son ekrandaki gönder düğmesini kullanın. İsterseniz yanıt dosyanızı da saklayın.</div></div><details><summary>1–9 önem ölçeği nasıl kullanılır?</summary><p>1: eşit önem; 3: orta derecede; 5: güçlü derecede; 7: çok güçlü derecede; 9: aşırı derecede daha önemli. 2, 4, 6 ve 8 iki komşu derece arasındaki yargıları belirtir. Örneğin 4, orta (3) ile güçlü (5) arasındadır.</p><p><b>Örnek:</b> X’i Y’den güçlü derecede önemli buluyorsanız önce X’i, sonra 5’i seçin. İkisini eşit önemli buluyorsanız yalnızca “Eşit önem” seçin. Bu örnek yanıtlarınıza kaydedilmez.</p></details><details><summary>Kararsız kaldığımda ne yapmalıyım?</summary><p>İfadelerin açıklamasına ve üst başlığına bakın. “Eşit önem” bir kararsızlık seçeneği değildir. Değerlendiremediğiniz soruyu boş bırakıp daha sonra dönebilirsiniz; yine karar veremiyorsanız araştırmacıya bildirin. Doğru veya yanlış bir uzman yanıtı yoktur.</p></details><details><summary>Hiyerarşi: hangi yetkinlik hangi başlık altında?</summary>'+tree()+'</details><details><summary>Aynı ifadeyi neden yeniden görüyorum?</summary><p>AHP (Analitik Hiyerarşi Süreci), aynı başlık altındaki ifadeleri ikişer ikişer karşılaştırır. Bu nedenle bir ifade farklı eşleşmelerde yeniden görünür. Ana alanlarda 6, temalarda 6 ve temel yetkinliklerde 15 soru vardır; toplam 14 karşılaştırma bölümü doldurulur.</p></details><details><summary>Yanıtlarım nereye kaydediliyor?</summary><p>Kontrol ve teslim ekranındaki gönder düğmesi, uzman kodunuzu, girdiğiniz mesleki bilgileri ve 27 yanıtınızı FormSubmit üzerinden araştırmacının e-posta adresine iletir. Gönderim yalnızca sizin düğmeye basmanızla başlar. Gönder düğmesine basılana kadar yanıtlar açık sayfada tutulur. Aşağıdaki isteğe bağlı kayıt seçeneği, aynı tarayıcıda devam etmenizi sağlar. Ortak bilgisayarda taslağı dosya olarak indirmeniz daha uygundur. Araştırmanın katılım, gizlilik ve iletişim bilgileri için araştırmacının davet metnini esas alın.</p></details></div><div class="card"><h2>Başlamadan önce</h2><p class="muted">Adınızı yazmanız gerekmez. Araştırmacının verdiği uzman kodunu kullanın; kodunuz yoksa araştırmacıdan isteyin. Diğer bilgiler isteğe bağlıdır.</p><div class="fields">'+field('expertCode','Uzman kodu','Örn. U01')+field('role','Görev / rol (isteğe bağlı)','Örn. tıp kütüphanecisi')+field('experienceYears','Mesleki deneyim yılı (isteğe bağlı)','Örn. 8','number')+field('institutionType','Kurum türü (isteğe bağlı)','Örn. üniversite hastanesi')+'</div><label style="margin:20px 0"><input type="checkbox" id="persist" '+(persist?'checked':'')+'> Yanıtlarımı bu tarayıcıda sakla; daha sonra devam edebileyim.</label>'+(restored?'<div class="hint">Önceki taslağınız yüklendi. '+answers.size+' yanıtla devam edebilirsiniz.</div>':'')+'<div class="row"><button class="btn" data-go="'+nextMissingPage()+'">'+(answers.size?'Kaldığım yerden devam et':'Değerlendirmeye başla')+'</button><button class="btn secondary" data-action="import">Taslak / yanıt dosyası aç</button></div><div class="status" role="status" id="status"></div></div>';}
function field(id,label,placeholder,type='text'){return '<label>'+label+'<input id="'+id+'" data-meta="'+id+'" type="'+type+'" '+(type==='number'?'min="0" max="80" step="1"':'maxlength="150"')+' placeholder="'+placeholder+'" value="'+esc(meta[id])+'"></label>';}
function tree(){return '<ul class="tree">'+Object.keys(domains).map(a=>'<li><b>'+nameOf(a)+'</b><ul>'+Object.keys(themes).filter(t=>themes[t].parent===a).map(t=>'<li>'+nameOf(t)+'<ul>'+Object.keys(basics).filter(b=>basics[b].parent===t).map(b=>'<li>'+nameOf(b)+'</li>').join('')+'</ul></li>').join('')+'</ul></li>').join('')+'</ul>';}
function nextMissingPage(){const c=comparisons.find(c=>!answers.has(c.no));return c?matrixDefs.findIndex(m=>m.id===c.matrixId)+1:15;}
function question(c){const a=answers.get(c.no),side=pending[c.no]||a?.side;return '<article class="card q" id="q-'+c.no+'"><div class="qhead"><span>Karşılaştırma '+c.no+' / 27</span><span>'+ (a?'Yanıtlandı ✓':'Yanıt bekliyor')+'</span></div><h3>Bu başlık altında hangisi daha önemli?</h3><p class="muted" style="font-size:14px">Önce bir ifade veya eşit önem seçin.</p><div class="options">'+['left','right'].map(s=>{const id=s==='left'?c.leftId:c.rightId;return '<button class="option" data-side="'+s+'" data-no="'+c.no+'" aria-pressed="'+(side===s)+'"><b>'+nameOf(id)+'</b><span>'+descriptions[id]+'</span></button>';}).join('')+'<button class="option equal" data-side="equal" data-no="'+c.no+'" aria-pressed="'+(side==='equal')+'">İkisi de eşit önemde · 1</button></div>'+(side&&side!=='equal'?'<div style="margin-top:20px"><b id="degree-label-'+c.no+'">Ne derecede daha önemli?</b><p class="muted" style="font-size:13px">Seçtiğiniz ifade: '+nameOf(side==='left'?c.leftId:c.rightId)+'</p><div class="degree-grid" role="group" aria-labelledby="degree-label-'+c.no+'">'+[2,3,4,5,6,7,8,9].map(d=>'<button class="degree" data-degree="'+d+'" data-no="'+c.no+'" aria-pressed="'+(a?.side===side&&a?.degree===d)+'"><b>'+d+'</b>'+labels[d]+'</button>').join('')+'</div><small>2, 4, 6 ve 8 komşu önem dereceleri arasındaki değerlerdir.</small></div>':'')+'<div class="choice '+(a?'answered':'')+'">'+esc(a?sentence(a):side?'Yanıtı tamamlamak için önem derecesini seçin.':'Henüz seçim yapılmadı.')+'</div><button class="textbtn" data-clear="'+c.no+'">Bu yanıtı kaldır</button></article>';}
function section(){const m=matrixDefs[page-1],p=parentOf(m);return '<div class="card"><div class="eyebrow">Bölüm '+page+' / 14 · '+(page===1?'Ana alanlar':page<=5?'Temalar':'Temel yetkinlikler')+'</div><h2>'+titleOf(m)+'</h2><p class="muted">'+(p?descriptions[p]:'Türkiye’de tıp kütüphaneciliğinde etkili hizmet sunabilme amacı açısından dört ana alanı karşılaştırın.')+'</p><div class="hint">'+(p?'Aşağıdaki ifadeleri yalnızca <b>'+nameOf(p)+'</b> başlığına katkıları açısından karşılaştırın.':'Her eşleşmede ana alanların mesleki açıdan göreli önemini değerlendirin.')+'</div></div>'+comparisons.filter(c=>c.matrixId===m.id).map(question).join('')+'<div class="status" id="status" role="status"></div><div class="footer"><button class="btn secondary" data-go="'+(page-1)+'">← Geri</button><button class="btn" data-next="true">'+(page===14?'Kontrol ve teslim →':'Sonraki bölüm →')+'</button></div><div class="row"><button class="textbtn" data-action="draft">Ara ver: taslağımı indir</button><button class="textbtn" data-go="15">Tüm yanıtları gözden geçir</button></div>';}
function reviewRows(print=false){return comparisons.map(c=>'<tr><td>'+c.no+'</td><td>'+esc(c.left)+'<br><small>ile '+esc(c.right)+'</small></td><td>'+esc(sentence(answers.get(c.no)))+'</td>'+(print?'':'<td><button class="textbtn" data-question="'+c.no+'">'+(answers.has(c.no)?'Düzenle':'Yanıtla')+'</button></td>')+'</tr>').join('');}
function review(){const done=answers.size===27;return '<div class="card"><div class="eyebrow">Son adım · Kontrol ve teslim</div><h1>'+ (done?'Değerlendirmeniz hazır.':'Yanıtlarınıza son bir göz atın.')+'</h1><p class="lead">'+answers.size+' / 27 karşılaştırma tamamlandı.</p>'+(!done?'<div class="hint warning">'+(27-answers.size)+' karşılaştırma eksik. Tam yanıt dosyası için eksikleri tamamlayın. Ara vermek için taslak indirebilirsiniz.</div>':'<div class="hint">Son kez yanıtlarınızı kontrol edin. Gönder düğmesiyle yanıtlarınızı araştırmacıya iletebilir, ayrıca dosya olarak saklayabilirsiniz.</div>')+'<p><b>Uzman kodu:</b> '+esc(meta.expertCode||'Girilmedi')+' <button class="textbtn" data-go="0">Bilgileri düzenle</button></p><ol><li><b>Yanıtlarınızı kontrol edin.</b> Eksikleri tamamlayın ve uzman kodunuzu doğrulayın.</li><li><b>Gönder düğmesine basın.</b> Uzman kodunuz, mesleki bilgileriniz ve 27 yanıtınız FormSubmit aracılığıyla furkangebel@gmail.com adresine iletilir. Gönderim sonucunu bu ekranda bekleyin.</li><li><b>Bir kopyasını saklayın.</b> Dilerseniz “Yazdır / PDF” ile okunabilir bir kayıt oluşturun.</li></ol><div class="row"><button class="btn" data-action="send" id="sendAnswers">Yanıtlarımı araştırmacıya gönder</button><button class="btn secondary" data-action="json">Yanıt dosyasını indir</button><button class="btn secondary" data-action="print">Yazdır / PDF</button></div><div class="status" id="status" role="status"></div><details><summary>Diğer dosya seçenekleri ve taslak</summary><div class="row" style="margin-top:12px"><button class="btn secondary" data-action="csv">CSV indir</button><button class="btn secondary" data-action="draft">Taslak indir</button><button class="btn secondary" data-action="import">Dosyadan devam et</button></div></details></div><div class="card"><h2>27 karşılaştırmanın özeti</h2><table class="review"><thead><tr><th>No</th><th>Karşılaştırma</th><th>Yanıtınız</th><th>İşlem</th></tr></thead><tbody>'+reviewRows()+'</tbody></table></div><div class="card"><h3>Bu cihazdaki formu temizle</h3><p class="muted">Yanıt dosyanızı kaydettiğinizden emin olun. Bu işlem formdaki bilgileri ve bu sürümün tarayıcıdaki taslağını siler.</p><button class="btn danger" data-action="reset">Formu ve kayıtlı taslağı temizle</button></div>';}
function render(focus=false){document.getElementById('content').innerHTML=page===0?guide():page===15?review():section();progress();if(focus){document.getElementById('content').focus();window.scrollTo({top:0,behavior:'smooth'});}}
function refreshQuestion(no,focusSelector){const el=document.getElementById('q-'+no);if(el){el.outerHTML=question(comparisons[no-1]);if(focusSelector)document.querySelector('#q-'+no+' '+focusSelector)?.focus();}save();progress();}
function setAnswer(no,side,degree){const c=comparisons[no-1];answers.set(no,{...c,side,degree,value:side==='equal'?1:side==='left'?degree:1/degree});pending[no]=side;}
function status(s){const e=document.getElementById('status');if(e)e.textContent=s;}
function complete(){if(answers.size!==27){status('Lütfen kalan '+(27-answers.size)+' karşılaştırmayı tamamlayın; veya taslak indirin.');return false;}if(!meta.expertCode.trim()){status('Yanıt dosyası için başlangıç bölümüne dönerek uzman kodunu girin.');return false;}if(meta.experienceYears!==''&&(!Number.isInteger(Number(meta.experienceYears))||Number(meta.experienceYears)<0||Number(meta.experienceYears)>80)){status('Deneyim yılını 0–80 arasında tam sayı olarak girin veya boş bırakın.');return false;}return true;}
function download(ext,content,draft=false){const code=meta.expertCode.replace(/[^A-Za-z0-9_-]/g,'_')||'uzman';const blob=new Blob([content],{type:ext==='json'?'application/json;charset=utf-8':'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ahp_'+(draft?'taslak_':'yanit_')+code+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);status('Dosya indirme başlatıldı. İndirilenler klasörünü kontrol edin.'+(draft?'':' Dosya araştırmacıya otomatik gönderilmez.'));}
function csv(p){const headers=['Uzman kodu','Görev/rol','Deneyim yılı','Kurum türü','Sıra','Matris','Bağlam','Sol ID','Sol öğe','Sağ ID','Sağ öğe','Yön','Derece','Kodlanan AHP değeri'];const rows=p.comparisons.map(a=>[meta.expertCode,meta.role,meta.experienceYears,meta.institutionType,a.no,a.matrixId,a.context,a.leftId,a.left,a.rightId,a.right,a.side==='left'?'Sol daha önemli':a.side==='right'?'Sağ daha önemli':'Eşit önem',a.degree,a.value]);const cell=v=>{let s=String(v??'');if([61,43,64,45,9,13].includes(s.charCodeAt(0)))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};return '\ufeff'+[headers,...rows].map(r=>r.map(cell).join(',')).join('\r\n');}
function printView(){document.getElementById('print').innerHTML='<h1>AHP Uzman Değerlendirme Formu</h1><p>Türkiye tıp kütüphaneciliği yetkinlikleri · '+esc(VERSION)+'</p><p><b>Uzman:</b> '+esc(meta.expertCode||'Belirtilmedi')+' · <b>Görev:</b> '+esc(meta.role)+' · <b>Deneyim:</b> '+esc(meta.experienceYears)+' · <b>Kurum türü:</b> '+esc(meta.institutionType)+'</p><p>'+new Date().toLocaleDateString('tr-TR')+' · '+answers.size+'/27 yanıt · '+(answers.size===27?'Tamamlandı':'TASLAK — eksik yanıtlar var')+'</p><table class="review"><thead><tr><th>No</th><th>Karşılaştırma</th><th>Yanıt</th></tr></thead><tbody>'+reviewRows(true)+'</tbody></table><p>Bu çıktı araştırmacıya ayrıca iletilmelidir.</p>';}
document.addEventListener('input',e=>{if(e.target.dataset.meta){meta[e.target.dataset.meta]=e.target.value;save();progress();}});
document.addEventListener('change',e=>{if(e.target.id==='persist'){persist=e.target.checked;if(persist)save();else{try{localStorage.removeItem(KEY)}catch(e){}storageMessage='';}progress();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined){page=Number(b.dataset.go);render(true);}else if(b.dataset.side){const no=Number(b.dataset.no),side=b.dataset.side;if(side==='equal')setAnswer(no,side,1);else if((pending[no]||answers.get(no)?.side)!==side){answers.delete(no);pending[no]=side;}refreshQuestion(no,'[data-side="'+side+'"]');}else if(b.dataset.degree){const no=Number(b.dataset.no);setAnswer(no,pending[no]||answers.get(no)?.side,Number(b.dataset.degree));refreshQuestion(no,'[data-degree="'+b.dataset.degree+'"]');}else if(b.dataset.clear){const no=Number(b.dataset.clear);answers.delete(no);delete pending[no];refreshQuestion(no,'[data-side="left"]');}else if(b.dataset.next){page++;render(true);if(page<=14&&comparisons.filter(c=>c.matrixId===matrixDefs[page-2].id).some(c=>!answers.has(c.no)))status('Önceki bölümde eksik yanıtlar kaldı. Soldaki bölüm listesinden geri dönebilirsiniz.');}else if(b.dataset.question){const c=comparisons[Number(b.dataset.question)-1];page=matrixDefs.findIndex(m=>m.id===c.matrixId)+1;render();document.getElementById('q-'+c.no).scrollIntoView({behavior:'smooth'});document.querySelector('#q-'+c.no+' button').focus({preventScroll:true});}else if(b.dataset.action){const a=b.dataset.action;if(a==='send'){sendAnswers();return;}if(a==='draft')download('json',JSON.stringify(payload(true),null,2),true);if(a==='json'&&complete())download('json',JSON.stringify(payload(),null,2));if(a==='csv'&&complete())download('csv',csv(payload()));if(a==='print'){printView();window.print();}if(a==='import')document.getElementById('importFile').click();if(a==='reset'&&confirm('Formdaki bütün yanıtlar, uzman bilgileri ve bu sürümün kayıtlı taslağı silinsin mi?')){answers.clear();pending={};meta={expertCode:'',role:'',experienceYears:'',institutionType:''};try{localStorage.removeItem(KEY)}catch(e){}persist=false;restored=false;page=0;render(true);}}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>200000)throw Error('Dosya çok büyük. Bu formdan indirilmiş bir JSON dosyası seçin.');const p=JSON.parse(await file.text());if((answers.size||Object.values(meta).some(Boolean))&&!confirm('Mevcut formdaki bilgiler dosyadakilerle değiştirilsin mi?'))return;ingest(p);save();render();status('Dosya açıldı. '+answers.size+' yanıt yüklendi.');}catch(err){status('Dosya yüklenemedi: '+err.message);}finally{e.target.value='';}});
window.addEventListener('beforeprint',printView);
window.addEventListener('beforeunload',e=>{if(!persist&&(answers.size||Object.values(meta).some(Boolean))){e.preventDefault();e.returnValue='';}});
try{const saved=localStorage.getItem(KEY);if(saved){ingest(JSON.parse(saved));persist=true;restored=true;storageMessage='Kayıtlı taslağınız geri yüklendi.';}}catch(e){storageMessage='Kayıtlı taslak okunamadı.';}
render();

let sending=false, sentSnapshot='';
async function sendAnswers(){
 if(sending||!complete())return;
 const p=payload(),snapshot=JSON.stringify([p.metadata,p.comparisons]);
 if(snapshot===sentSnapshot){status('Bu yanıtlar gönderim hizmeti tarafından zaten kabul edildi. Değişiklik yaptıysanız yeniden gönderebilirsiniz.');return;}
 sending=true;const button=document.getElementById('sendAnswers');if(button){button.disabled=true;button.textContent='Gönderiliyor…';}
 status('Gönderim sürüyor. Lütfen sayfayı kapatmayın.');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
 try{
